name: Check Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run task lint

      - name: Typecheck
        run: uv run task typecheck

      - name: Test
        run: |
          uv run pytest -m "not integration" -vv
          uv run coverage run -m pytest -m "not integration"
          uv run coverage xml
        # Coverage is re-run under `coverage` (rather than reusing the -vv
        # run above) so a failing test still shows a normal pytest trace
        # instead of coverage's own runner output.

      # Requires the SONAR_TOKEN secret and sonar-project.properties.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
